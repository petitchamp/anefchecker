<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANEF Status</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">
    <header>
      <h1 data-i18n="appName">ANEF Status</h1>
    </header>
    <main id="content">
      <div id="loading" class="state-view">
        <div class="spinner"></div>
        <p data-i18n="loading">Checking status...</p>
      </div>
      <div id="error" class="state-view hidden">
        <div class="icon error-icon">!</div>
        <p id="error-message" data-i18n="error">Error fetching status.</p>
        <button id="retry-btn" data-i18n="retry">Retry</button>
      </div>
      <div id="login-required" class="state-view hidden">
        <div class="icon login-icon">🔒</div>
        <p data-i18n="loginRequired">Please log in to ANEF first.</p>
        <a href="https://sso.anef.dgef.interieur.gouv.fr/auth/realms/anef-usagers/protocol/openid-connect/auth?client_id=anef-usagers&theme=portail-anef&redirect_uri=https%3A%2F%2Fadministration-etrangers-en-france.interieur.gouv.fr%2Fparticuliers%2F%23&response_mode=fragment&response_type=code&scope=openid"
          target="_blank" class="button" data-i18n="loginBtn">Go to Login</a>
      </div>
      <div id="status-display" class="state-view hidden">
        <div class="status-card">
          <span class="label" data-i18n="statusLabel">Status</span>
          <h2 id="status-text">--</h2>
        </div>
        <div class="details">
          <p><strong data-i18n="dateLabel">Date:</strong> <span id="status-date">--</span></p>
          <div id="extra-info"></div>
        </div>
        <button id="refresh-btn" data-i18n="refresh">Refresh</button>
      </div>
    </main>
  </div>
  <script src="popup.js"></script>
</body>

</html>
